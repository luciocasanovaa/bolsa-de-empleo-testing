<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El viaje del dinero · EduTrust</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="viaje">
  <header class="barra">
    <div>
      <h1>El viaje del dinero</h1>
      <p class="lema" id="subtitulo">Cargando la beca…</p>
    </div>
    <div class="barra-acciones"><a href="index.html">← Volver a la demo</a></div>
  </header>

  <main class="columna">
    <section id="origen" class="tarjeta" aria-live="polite"></section>
    <section id="diagrama" class="tarjeta" aria-label="Recorrido del dinero"></section>
    <section id="cuadra" class="tarjeta" aria-label="¿Cuadra?"></section>
    <section id="linea" class="tarjeta" aria-label="Línea de tiempo"></section>
    <section id="seguir" class="tarjeta" aria-label="Seguí tu aporte">
      <h2>Seguí tu aporte</h2>
      <p class="nota">Pegá el código de tu transacción (empieza con 0x) y te mostramos a dónde fue esa plata.</p>
      <form id="form-seguir" class="fila">
        <label for="hash">Código de la transacción</label>
        <input id="hash" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="0x…" style="min-width:16rem;flex:1">
        <button type="submit">Seguir</button>
      </form>
      <div id="resultado-seguir" aria-live="polite"></div>
    </section>
    <section id="compartir" class="tarjeta" aria-label="Compartir">
      <h2>Compartir esta beca</h2>
      <div id="qr" class="qr" role="img" aria-label="Código QR con el enlace a esta página"></div>
      <p class="nota" id="enlace"></p>
    </section>
  </main>

  <script type="module" src="js/viaje.js"></script>
</body>
</html>
